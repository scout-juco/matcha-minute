<script id="game-core">
'use strict';
const RULES = Object.freeze({ roundSeconds:90, patience:45, arrivalEvery:8, maxOrders:4, waterRate:38, waterTolerance:8, whiskRadians:Math.PI*3.5, minWhiskSpeed:1.2, maxWhiskSpeed:13, stars:[120,300,500] });
const RECIPES = Object.freeze([
  {id:'strawberry',name:'Strawberry Cloud',short:'Strawberry',scoops:2,water:60,milk:'oat',flavor:'strawberry',topping:'cream',color:'#e6a6ae',description:'Oat milk · strawberry · cream'},
  {id:'classic',name:'Classic Matcha',short:'Classic',scoops:2,water:60,milk:'milk',flavor:null,topping:null,color:'#a8c16d',description:'Milk · ice · pure matcha'},
  {id:'vanilla',name:'Vanilla Daydream',short:'Vanilla',scoops:1,water:40,milk:'oat',flavor:'vanilla',topping:'cream',color:'#e6ce8b',description:'Oat milk · vanilla · cream'},
  {id:'mango',name:'Mango Sunshine',short:'Mango',scoops:1,water:40,milk:'oat',flavor:'mango',topping:'petals',color:'#edb655',description:'Oat milk · mango · petals'}
]);
const NAMES = {ice:'Ice',milk:'Milk',oat:'Oat milk',strawberry:'Strawberry',vanilla:'Vanilla',mango:'Mango',cream:'Cream',petals:'Petals',lid:'Lid',matcha:'Matcha',powder:'Matcha powder'};
function newWork(){return {scoops:0,water:0,whisk:0,ingredients:[],topping:null,lid:false,mistakes:0,whiskPenalty:0};}
function waterReady(w,r){return Math.abs(w.water-r.water)<=RULES.waterTolerance;}
function brewReady(w,r){return w.scoops===r.scoops&&waterReady(w,r)&&w.whisk>=RULES.whiskRadians;}
function requiredIngredients(r){return ['ice',r.milk,...(r.flavor?[r.flavor]:[]),'matcha'];}
function buildReady(w,r){return brewReady(w,r)&&requiredIngredients(r).every(x=>w.ingredients.includes(x));}
function finishReady(w,r){return buildReady(w,r)&&(!r.topping||w.topping===r.topping)&&w.lid;}
function rewardFor(w,r,age){
 const waterError=Math.abs(w.water-r.water)/RULES.waterTolerance;
 const quality=Math.max(.35,1-waterError*.13-w.mistakes*.08-Math.min(.2,w.whiskPenalty*.012));
 const speed=Math.max(0,1-age/RULES.patience);
 const base=100;
 const tip=Math.max(0,Math.round(50*speed*quality));
 return {base,tip,total:base+tip,quality};
}
function starsFor(score){return RULES.stars.filter(t=>score>=t).length;}
function whiskSample(previous,point,dt){
 if(!previous||dt<=0||dt>.22)return {amount:0,speed:0,valid:false};
 let delta=point.angle-previous.angle;
 if(delta>Math.PI)delta-=Math.PI*2;
 if(delta<-Math.PI)delta+=Math.PI*2;
 const speed=Math.abs(delta)/dt;
 const valid=point.radius>=.2&&point.radius<=1.2&&previous.radius>=.2&&previous.radius<=1.2;
 return {amount:valid&&speed>=RULES.minWhiskSpeed&&speed<=RULES.maxWhiskSpeed?Math.abs(delta):0,speed,valid};
}
</script>

function addIngredient(type){const o=current();if(!o||!playable())return;const w=o.work,r=activeRecipe(o);if(type==='powder'){if(state.station!==0)return;if(w.scoops>=r.scoops){feedback('That’s enough matcha. On to the water!');return;}w.scoops++;sound(510);renderStage();renderRecipe();return;}if(state.station===1){if(!brewReady(w,r)){toast('Whisk your matcha at station 1 first.');return;}if(w.ingredients.includes(type))return;if(!requiredIngredients(r).includes(type)){w.mistakes++;toast(`This order doesn’t need ${NAMES[type].toLowerCase()}. Check the recipe!`);sound(180,.1);return;}if(type==='matcha'&&!requiredIngredients(r).filter(x=>x!=='matcha').every(x=>w.ingredients.includes(x))){feedback('Add the ice, milk & any syrup before the matcha.',true);return;}w.ingredients.push(type);}else if(state.station===2){if(!buildReady(w,r)){toast('Add all the ingredients at station 2 first.');return;}if(type==='lid'){if(r.topping&&w.topping!==r.topping){feedback('Add the topping before the lid.',true);return;}w.lid=true;}else if(type!==r.topping){w.mistakes++;toast(r.topping?`This drink needs ${NAMES[r.topping].toLowerCase()}.`:'This classic doesn’t need a topping. Just a lid!');sound(180,.1);return;}else{w.topping=type;}}sound(620,.06);renderStage();renderRecipe();renderOrders();}
function stopPour(){if(!pouring)return;pouring=false;$('waterButton')?.classList.remove('pouring');if(!current()||!playable())return;renderStage();renderRecipe();const w=current().work,r=activeRecipe(current());if(waterReady(w,r)){sound(720,.1);feedback('Nice pour! Hold the bowl & whisk in circles.');}else if(w.water>r.water+8){feedback('Oops, too much! Reset this drink below.',true);sound(170,.15);}}
function sampleWhisk(e){const o=current();if(!o||!whisking||!playable())return;const rect=$('bowl').getBoundingClientRect();const x=(e.clientX-(rect.left+rect.width/2))/(rect.width*.375),y=(e.clientY-(rect.top+rect.height*.36))/(rect.height*.22);const point={angle:Math.atan2(y,x),radius:Math.hypot(x,y)};const now=performance.now(),dt=(now-whisking.lastTime)/1000;const result=whiskSample(whisking.last,point,dt);whisking.last=point;whisking.lastTime=now;if(result.amount){o.work.whisk=Math.min(RULES.whiskRadians,o.work.whisk+result.amount);feedback('Lovely rhythm. Keep those circles going!');}else if(result.valid&&dt>0&&dt<.22){const message=result.speed>RULES.maxWhiskSpeed?'A little slower — let the matcha bloom.':'A little faster — keep a steady circle.';feedback(message,true);whisking.badTime+=dt;if(whisking.badTime>.5){o.work.whiskPenalty++;whisking.badTime=0;}}else if(!result.valid)feedback('Trace the oval inside the bowl.');const cursor=$('whiskCursor');if(cursor){cursor.style.left=(e.clientX-rect.left-20)+'px';cursor.style.top=(e.clientY-rect.top-60)+'px';cursor.style.transform=`rotate(${18+x*13}deg)`;}updateLive();checkWhiskDone();}
function checkWhiskDone(){const o=current();if(o&&o.work.whisk>=RULES.whiskRadians&&(whisking||keyboardWhisk)){whisking=null;keyboardWhisk=false;sound(820,.15);renderStage();renderRecipe();renderOrders();feedback('Perfectly whisked. Your matcha is ready!');}}
function updateLive(){const o=current();if(!o||state.station!==0)return;const w=o.work,r=activeRecipe(o),step=stepInfo(o),whisk=step>=2&&!pouring;const value=$('meterValue'),fill=$('meterFill');if(value)value.textContent=whisk?`${Math.min(100,Math.round(w.whisk/RULES.whiskRadians*100))}%`:`${Math.round(w.water)} / ${r.water} ml`;if(fill){fill.style.width=(whisk?Math.min(100,w.whisk/RULES.whiskRadians*100):Math.min(100,w.water))+'%';fill.style.background=w.water>r.water+8?'#df947e':'#88b56e';}if($('meterTitle'))$('meterTitle').textContent=whisk?'Whisk it smooth':'Just enough water';if($('targetZone'))$('targetZone').style.display=whisk?'none':'';if($('meterNote'))$('meterNote').textContent=whisk?'Hold the bowl & draw steady circles':w.water>r.water+8?'Too much water — reset this drink':'Release inside the green zone';const liquid=document.querySelector('.bowl-liquid');if(liquid&&w.water>0)liquid.setAttribute('fill',w.whisk>RULES.whiskRadians*.7?'#86a952':'#a4ba71');}
function switchStation(index){if(!playable())return;cancelInteraction();state.station=index;renderStage();sound(400+index*100,.035);}
function cancelInteraction(){pouring=false;whisking=null;keyboardWhisk=false;if(drag){drag.ghost.remove();drag=null;}document.querySelectorAll('.drop-highlight').forEach(el=>el.classList.remove('drop-highlight'));$('waterButton')?.classList.remove('pouring');}
function burst(){const colors=['#b5cf7a','#e8b6b4','#e9c473','#749e64'];for(let i=0;i<17;i++){const el=document.createElement('div');el.className='confetti';el.style.cssText=`left:${45+Math.random()*10}%;top:38%;background:${colors[i%4]};--dx:${(Math.random()-.5)*500}px;--dy:${120+Math.random()*270}px;border-radius:${i%2?'50%':'2px'}`;document.body.appendChild(el);setTimeout(()=>el.remove(),1100);}}
function serve(){const o=current();if(!o||!playable()||!finishReady(o.work,activeRecipe(o)))return;cancelInteraction();const age=state.practice?12:state.elapsed-o.born;const result=rewardFor(o.work,activeRecipe(o),age);state.score+=result.total;state.tips+=result.tip;state.served++;state.orders=state.orders.filter(x=>x.id!==o.id);state.selected=state.orders[0]?.id??null;state.station=0;sound(880,.12);setTimeout(()=>sound(1100,.15),110);burst();toast(`Lovely! +${result.base} coins + ${result.tip} tip ♡`);if(state.practice){if(state.served===1)toast('First drink served! Try another recipe or start a timed round.');addOrder();}else if(!state.orders.length){addOrder();state.arrival=0;}renderAll();}
function showModal(content){lastModalFocus=document.activeElement;$('modal').innerHTML='<div class="modal-stripe"></div>'+content;$('overlay').hidden=false;$('app').inert=true;requestAnimationFrame(()=>$('modal').querySelector('button')?.focus());}
function hideModal(){$('overlay').hidden=true;$('app').inert=false;lastModalFocus?.isConnected&&lastModalFocus?.focus();}
function showWelcome(){state.mode='welcome';showModal(`<div class="welcome"><div class="welcome-art"><span class="spark">✦</span><span class="spark s2">✧</span><div class="big-drink">${cupArt(RECIPES[0])}</div><span class="art-label">freshly whisked happiness</span></div><div><p class="eyebrow">Your little café is waiting</p><h2>Ready,<br>set, <em>matcha.</em></h2><p class="intro">A few scoops. A little swirl. A whole lot of happy customers.<br>How much joy can you pour in 90 seconds?</p><div class="mini-steps"><span><b>01</b>Whisk it</span><span><b>02</b>Build it</span><span><b>03</b>Serve it</span></div><button class="primary" id="playButton">Open café · 90 seconds →</button><button class="secondary" id="practiceButton">Take a practice sip first</button></div></div><div class="modal-foot">Drag & drop · mouse or touch · a fresh start every round</div>`);$('modal').querySelector('h2').id='modalTitle';$('playButton').onclick=()=>start();$('practiceButton').onclick=()=>start(true);}
function pause(kind='pause'){if(!playable())return;state.mode='paused';cancelInteraction();renderHud();if(kind==='help'){showHelp();return;}showModal(`<div class="dialog-content"><p class="eyebrow">A tiny tea break</p><h2 id="modalTitle">Take a little breather.</h2><p>Your drinks are safe. The clock is paused.</p><button class="primary" id="resumeButton">Back to the café →</button>${state.practice?'<button class="secondary" id="startRoundButton">Start a 90-second round</button>':''}<button class="secondary" id="quitButton">Back to menu</button></div>`);$('resumeButton').onclick=resume;$('quitButton').onclick=()=>{state.practice=false;state.elapsed=0;resetPreview();showWelcome();};if($('startRoundButton'))$('startRoundButton').onclick=()=>start();}
function resume(){state.mode='playing';cancelInteraction();hideModal();lastFrame=performance.now();renderStage();renderHud();}
function showHelp(){showModal(`<div class="dialog-content"><p class="eyebrow">The café field guide</p><h2 id="modalTitle">A little sip of know-how.</h2><div class="help-grid"><div class="help-card"><h3>01 · Matcha</h3><p><b>Drag powder</b> into the bowl, one scoop at a time. <b>Hold the pitcher</b> and release in the green zone. Then <b>hold & circle</b> inside the bowl at a steady pace.</p></div><div class="help-card"><h3>02 · Build</h3><p><b>Drag ingredients</b> into the cup. Follow the recipe: ice, the right milk, syrup if requested, and your freshly whisked matcha last.</p></div><div class="help-card"><h3>03 · Finish</h3><p>Add the requested topping, then a lid. <b>Click Serve</b> or drag your drink to its ticket. Fast, careful work earns bigger tips!</p></div></div><p class="help-key"><b>Keyboard:</b> 1 / 2 / 3 switch stations · P pauses · Tab to ingredients, Enter to add · hold Space on the pitcher to pour or on the bowl to whisk.</p><p>Each drink earns <b>100 coins + up to 50 in tips</b>.<br>Stars: ★ 120 &nbsp; ★★ 300 &nbsp; ★★★ 500 total coins.<br>Wrong ingredients reduce tips. Reset a spoiled pour below the stations.</p><button class="primary" id="helpClose">Got it. Let’s make matcha →</button></div>`);$('helpClose').onclick=()=>{if(state.mode==='paused')resume();else showWelcome();};}
function endRound(){cancelInteraction();state.mode='ended';state.elapsed=RULES.roundSeconds;const isBest=state.score>state.best;if(isBest){state.best=state.score;try{localStorage.setItem('matcha-minute-best',String(state.best));}catch{}}renderHud();const stars=starsFor(state.score);showModal(`<div class="dialog-content"><p class="eyebrow">That’s a wrap, barista</p><h2 id="modalTitle">${stars===3?'You’re everyone’s cup of tea.':stars===2?'A lovely little rush.':stars===1?'A sweet start.':'Every barista starts somewhere.'}</h2><div class="stars" aria-label="${stars} out of 3 stars">${[1,2,3].map(x=>`<span class="${x<=stars?'earned':''}">★</span>`).join('')}</div><div class="result-total">${state.score}</div><div class="eyebrow">Total coins, including tips</div>${isBest?'<div class="best-label">✦ A fresh personal best! ✦</div>':`<div class="best-label">Personal best · ${state.best}</div>`}<div class="result-stats"><div class="result-stat"><strong>${state.served}</strong><small>drinks served</small></div><div class="result-stat"><strong>${state.tips}</strong><small>coins in tips</small></div><div class="result-stat"><strong>${state.missed}</strong><small>customers left</small></div></div><p>${stars===3?'Three stars. One very happy café.':`Next star at ${RULES.stars[stars]} coins. You’ve got this!`}</p><button class="primary" id="replayButton">One more round →</button><button class="secondary" id="practiceAgain">Practice a little</button></div>`);$('replayButton').onclick=()=>start();$('practiceAgain').onclick=()=>start(true);if(stars>0)burst();sound(660,.25);}
function tick(now){const dt=Math.max(0,(now-lastFrame)/1000);lastFrame=now;if(playable()){
 if(!state.practice){state.elapsed+=dt;state.arrival+=dt;if(state.elapsed>=RULES.roundSeconds){endRound();requestAnimationFrame(tick);return;}if(state.arrival>=RULES.arrivalEvery&&state.orders.length<RULES.maxOrders){state.arrival=0;addOrder();renderOrders();renderRecipe();if(state.orders.length===1)renderStage();sound(700,.05);}const expired=state.orders.filter(o=>state.elapsed-o.born>=RULES.patience);if(expired.length){const activeExpired=expired.some(o=>o.id===state.selected);state.missed+=expired.length;state.orders=state.orders.filter(o=>state.elapsed-o.born<RULES.patience);if(activeExpired){cancelInteraction();state.selected=state.orders[0]?.id??null;state.station=0;}renderOrders();if(activeExpired){renderStage();renderRecipe();}toast('A customer had to go. Catch the next one!');}for(const o of state.orders){const bar=document.querySelector(`[data-patience="${o.id}"]`);if(bar){const left=Math.max(0,1-(state.elapsed-o.born)/RULES.patience);bar.style.width=left*100+'%';bar.classList.toggle('low',left<.3);}}}
 const o=current();if(o){if(pouring){o.work.water=Math.min(100,o.work.water+RULES.waterRate*dt);updateLive();if(o.work.water>=100)stopPour();}if(keyboardWhisk&&stepInfo(o)===2){o.work.whisk=Math.min(RULES.whiskRadians,o.work.whisk+4.5*dt);updateLive();const cursor=$('whiskCursor');if(cursor)cursor.style.transform=`rotate(${Math.sin(now/120)*20+20}deg)`;checkWhiskDone();}}
 const hudSecond=Math.ceil(state.elapsed);if(hudSecond!==lastHud){lastHud=hudSecond;renderHud();}
 }requestAnimationFrame(tick);}
document.addEventListener('pointermove',e=>{if(drag&&e.pointerId===drag.pointerId){e.preventDefault();moveDrag(e);}},{passive:false});
document.addEventListener('pointerup',e=>{drop(e);stopPour();whisking=null;});
document.addEventListener('pointercancel',()=>{cancelInteraction();if(playable())renderStage();});
document.addEventListener('keydown',e=>{if(!$('overlay').hidden){if(e.code==='Tab'){const buttons=[...$('modal').querySelectorAll('button:not(:disabled)')];const first=buttons[0],last=buttons.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last?.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first?.focus();}}if(e.code==='Escape'&&state.mode==='paused')resume();return;}if(e.repeat)return;if(['Digit1','Digit2','Digit3'].includes(e.code)){e.preventDefault();switchStation(Number(e.code.slice(-1))-1);}if(e.code==='KeyP'||e.code==='Escape'){e.preventDefault();pause();}});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&playable())pause();});
window.addEventListener('blur',()=>{cancelInteraction();if(playable())pause();});
$('pauseButton').onclick=()=>pause();$('helpButton').onclick=()=>{if(playable())pause('help');else showHelp();};
$('soundButton').onclick=()=>{state.sound=!state.sound;$('soundButton').innerHTML=icon('sound');$('soundButton').setAttribute('aria-label',`Turn sound ${state.sound?'off':'on'}`);$('soundButton').title=`Turn sound ${state.sound?'off':'on'}`;sound(700,.1);};
document.querySelectorAll('[data-station]').forEach(b=>b.onclick=()=>switchStation(Number(b.dataset.station)));
$('startTimed').onclick=()=>start();
$('resetDrink').onclick=()=>{if(!playable()||!current())return;cancelInteraction();const o=current();o.work=newWork();o.work.mistakes=1;state.station=0;renderAll();toast('Fresh bowl, fresh start.');};
$('brandIcon').innerHTML=cupArt(RECIPES[1]);$('coinIcon').innerHTML=icon('coin');$('servedIcon').innerHTML=cupArt(RECIPES[1]);$('tipIcon').innerHTML=icon('tip');$('clockIcon').innerHTML=icon('clock');$('soundButton').innerHTML=icon('sound');$('brewIcon').innerHTML=art('whisk');$('buildIcon').innerHTML=cupArt(RECIPES[0]);$('finishIcon').innerHTML=art('cream');
resetPreview();showWelcome();requestAnimationFrame(tick);
})();
</script>
</body>
