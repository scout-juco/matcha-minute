name: Sync Public Repo & Deploy

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  deployments: write

concurrency:
  group: sync-and-deploy
  cancel-in-progress: false

jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Matcha Minute repository
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Checkout original FridayJam repository
        uses: actions/checkout@v6
        with:
          repository: scout-juco/FridayJam_matcha
          ref: main
          path: .upstream
          persist-credentials: false

      - name: Sync game files
        run: |
          set -euo pipefail

          test -f .upstream/public/index.html
          mkdir -p public
          rsync -a --delete .upstream/public/ public/

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add public/

          if ! git diff --cached --quiet; then
            git commit -m "Sync game from FridayJam_matcha"
            git push origin HEAD:main
          fi

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          command: pages deploy public --project-name=matcha-minute --branch=main
